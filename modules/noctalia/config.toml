[audio]
enable_sounds = false

[bar.default]
background_opacity = 0.7
center = [ "workspaces" ]
end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "clock" ]
font_weight = 700
margin_ends = 0
radius = 0
shadow = false
start = [ "active_window" ]
thickness = 32

[dock]
background_opacity = 0.7

[lockscreen_widgets]
enabled = false
schema_version = 2

[notification]
background_opacity = 0.7

[osd]
background_opacity = 0.7

    [osd.kinds]
    lock_keys = false
    media = false

[shell]
corner_radius_scale = 0.0
polkit_agent = true
settings_show_advanced = false

    [shell.panel]
    control_center_placement = "floating"
    control_center_position = "top_right"
    open_near_click_control_center = true
    transparency_mode = "soft"

[theme]
builtin = "Tokyo-Night"
mode = "dark"
pure_black_dark = true
source = "builtin"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "antigravity", "opencode", "vscode" ]
    enable_builtin_templates = true
    enable_community_templates = true

[widget.active_window]
display = "text_only"
interactive = false
max_length = 600

[widget.media]
hide_album_art = true
hide_when_no_media = true
max_length = 800

[widget.network]
show_label = false

[widget.workspaces]
style = "minimal"
